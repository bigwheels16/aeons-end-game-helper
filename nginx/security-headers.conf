# Security headers shared by every response.
#
# nginx only inherits add_header directives from the enclosing level when the
# current level declares none of its own, so any location that adds a header
# (e.g. Cache-Control) must `include` this file to keep these headers.
# `always` makes nginx send them on error responses (4xx/5xx) too.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://aeonsend.wiki.gg; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
