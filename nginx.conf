server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. Any location that declares its own add_header must
    # include this snippet again, because nginx drops inherited add_header
    # directives in that case.
    include /etc/nginx/snippets/security-headers.conf;

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public";
    }
}
